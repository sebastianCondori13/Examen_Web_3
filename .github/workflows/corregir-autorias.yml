name: Aplicar corrección autorizada de autorías
on:
  push:
    branches: [chore/corregir-autorias]
    paths:
      - .github/workflows/corregir-autorias.yml
      - .github/scripts/repair_authorship.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Corregir autores con respaldo y protección de concurrencia
        run: python .github/scripts/repair_authorship.py --apply
